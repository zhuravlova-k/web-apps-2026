<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>Афіша подій міста</h1>
            <nav>
                <a href="#events">Події</a>
                <a href="#selected-event">Обрана подія</a>
            </nav>
        </div>
    </header>

    <div class="layout-wrapper">
        <main>
            <section id="filters">
                <h2>Фільтр за датою/категорією</h2>
                <div class="filter-controls">
                    <label for="date-filter">Дата:</label>
                    <input type="date" id="date-filter" name="date">

                    <label for="category-filter">Категорія:</label>
                    <select id="category-filter" name="category">
                        <option value="all">Усі</option>
                        <option value="music">Музика</option>
                        <option value="art">Мистецтво</option>
                        <option value="theater">Театр</option>
                    </select>
                </div>
                <p id="events-count" style="margin-top: 15px; font-weight: bold; color: #6a040f;"></p>
            </section>

            <section id="events">
                <h2>Події</h2>
                <div class="cards" id="events-list">
                </div>
            </section>
        </main>

        <aside id="selected-event">
            <h2>Деталі обраної події</h2>
            <p>Натисніть на подію, щоб побачити деталі.</p>
        </aside>
    </div>

    <footer>
        <p>Контакти організаторів: info@city-events.ua</p>
    </footer>
</body>

</html>
