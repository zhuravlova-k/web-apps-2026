<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div id="app" v-cloak>
        <header class="site-header">
            <div class="header-inner">
                <h1>Афіша подій міста</h1>
                <nav>
                    <a href="#/" data-link :class="{ 'router-link-active': activeNav === '/' }"
                        :aria-current="activeNav === '/' ? 'page' : null">Події</a>
                    <a href="#/saved" data-link :class="{ 'router-link-active': activeNav === '/saved' }"
                        :aria-current="activeNav === '/saved' ? 'page' : null">Обрані</a>
                </nav>
            </div>
        </header>

        <div class="layout-wrapper">
            <!-- єдиний контейнер, у який рендеряться всі "сторінки" -->
            <main ref="main" tabindex="-1">
                <!-- keep-alive зберігає стан сторінок (фільтр, текст у формі) під час навігації -->
                <keep-alive>
                    <component :is="currentViewComponent" :events="events" :saved-events="savedEvents"
                        :form-categories="formCategories" :filter-categories="filterCategories"
                        :api-status-message="apiStatusMessage" :api-status-class="apiStatusClass"
                        :is-api-loading="isApiLoading" :is-loading="isDataLoading" :route-params="routeParams"
                        :back-target="backTarget" @add-event="addEvent" @toggle-favorite="toggleFavorite"
                        @remove-favorite="removeFavorite" @load-api-data="loadApiData">
                    </component>
                </keep-alive>
            </main>
        </div>

        <footer>
            <p>Контакти організаторів: info@city-events.ua</p>
        </footer>
    </div>
</body>

</html>
