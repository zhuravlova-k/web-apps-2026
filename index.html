<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>Афіша подій міста</h1>
            <nav>
                <a href="#events">Події</a>
                <a href="#selected-event">Обрана подія</a>
            </nav>
        </div>
    </header>

    <div class="layout-wrapper" id="app" v-cloak>
        <main>
            <section id="filters" class="filters-section">
                <h2>Фільтр за категорією</h2>
                <div class="filter-controls">
                    <span class="filter-label">Категорія:</span>
                    <button v-for="(label, key) in filterCategories" :key="key" type="button" class="filter-btn"
                        :class="{ active: currentFilter === key }" :aria-pressed="currentFilter === key"
                        @click="currentFilter = key">
                        {{ label }}
                    </button>
                </div>
                <p id="events-count" class="status-msg">Знайдено подій: {{ filteredEvents.length }}</p>
            </section>

            <section id="add-event-section" class="add-event-section">
                <h2>Додати нову подію</h2>
                <form id="add-event-form" class="add-event-form" @submit.prevent="addEvent">
                    <div class="form-group">
                        <label for="event-title">Назва події:</label>
                        <input type="text" id="event-title" v-model.trim="newEvent.title" required pattern=".{3,}"
                            title="Щонайменше 3 символи">
                    </div>

                    <div class="form-group">
                        <label for="event-category">Категорія:</label>
                        <select id="event-category" v-model="newEvent.category" required>
                            <option value="" disabled>Оберіть категорію</option>
                            <option v-for="(label, key) in formCategories" :key="key" :value="key">
                                {{ label }}
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-date">Дата:</label>
                        <input type="date" id="event-date" v-model="newEvent.date" required>
                    </div>

                    <button type="submit" class="submit-btn">Додати подію</button>
                </form>
            </section>

            <section id="events">
                <h2>Події</h2>

                <div class="api-controls">
                    <button type="button" class="submit-btn api-btn" @click="loadApiData" :disabled="isApiLoading">
                        Оновити події (API)
                    </button>
                    <span class="status-msg" :class="apiStatusClass" role="status" aria-live="polite">
                        {{ apiStatusMessage }}
                    </span>
                </div>

                <div class="cards" id="events-list">
                    <event-card v-for="event in filteredEvents" :key="event.id" :event-id="event.id"
                        :title="event.title" :category="event.category" :category-label="formCategories[event.category]"
                        :date="event.date" :eng-name="event.engName" :selected="event.id === selectedId"
                        @select-event="handleSelectEvent">
                    </event-card>
                </div>
            </section>
        </main>

        <aside id="selected-event" class="details-panel" ref="details">
            <h2>Деталі обраної події</h2>
            <event-details v-if="selectedEvent" :title="selectedEvent.title"
                :category-label="formCategories[selectedEvent.category]" :date="selectedEvent.date"
                :eng-name="selectedEvent.engName">
            </event-details>
            <p v-else class="details-placeholder">
                Натисніть на картку події, щоб побачити деталі.
            </p>
        </aside>
    </div>

    <footer>
        <p>Контакти організаторів: info@city-events.ua</p>
    </footer>
</body>

</html>
