<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>Афіша подій міста</h1>
            <nav>
                <a href="#events">Події</a>
                <a href="#selected-event">Обрана подія</a>
            </nav>
        </div>
    </header>

    <div class="layout-wrapper">
        <main>
            <section id="filters" class="filters-section">
                <h2>Фільтр за категорією</h2>
                <div class="filter-controls" id="category-filters">
                    <span class="filter-label">Категорія:</span>
                    <button type="button" class="filter-btn active" data-filter="all">Усі</button>
                    <button type="button" class="filter-btn" data-filter="music">Музика</button>
                    <button type="button" class="filter-btn" data-filter="art">Мистецтво</button>
                    <button type="button" class="filter-btn" data-filter="theater">Театр</button>
                    <button type="button" class="filter-btn" data-filter="holiday">Свята</button>
                </div>
                <p id="events-count"></p>
            </section>

            <section id="add-event-section" class="add-event-section">
                <h2>Додати нову подію</h2>
                <form id="add-event-form" class="add-event-form">
                    <div class="form-group">
                        <label for="event-title">Назва події:</label>
                        <input type="text" id="event-title" name="title" required pattern=".{3,}">
                    </div>

                    <div class="form-group">
                        <label for="event-category">Категорія:</label>
                        <select id="event-category" name="category" required>
                            <option value="" disabled selected>Оберіть категорію</option>
                            <option value="music">Музика</option>
                            <option value="art">Мистецтво</option>
                            <option value="theater">Театр</option>
                            <option value="holiday">Свято</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="event-date">Дата:</label>
                        <input type="date" id="event-date" name="date" required>
                    </div>

                    <button type="submit" class="submit-btn">Додати подію</button>
                </form>
            </section>

            <section id="events">
                <h2>Події</h2>

                <div class="api-controls">
                    <button type="button" id="load-api-btn" class="submit-btn api-btn">Оновити події (API)</button>
                    <span id="api-status" class="status-msg" role="status" aria-live="polite"></span>
                </div>

                <div class="cards" id="events-list">
                </div>
            </section>
        </main>

        <aside id="selected-event" class="details-panel">
            <h2>Деталі обраної події</h2>
            <p>Натисніть на подію, щоб побачити деталі.</p>
        </aside>
    </div>

    <footer>
        <p>Контакти організаторів: info@city-events.ua</p>
    </footer>
</body>

</html>
