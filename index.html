<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афіша подій міста</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Афіша подій міста</h1>
        <nav>
            <a href="#events">Події</a>
            <a href="#selected-event">Обрана подія</a>
        </nav>
    </header>

    <main>
        <section id="filters">
            <h2>Фільтр за датою/категорією</h2>
            <label for="category-filter">Оберіть категорію:</label>
            <select id="category-filter" name="category">
                <option value="music">Музика</option>
                <option value="art">Мистецтво</option>
                <option value="theater">Театр</option>
            </select>
        </section>

        <section id="events">
            <h2>Події</h2>
            <article>
                <h3>Симфонічний концерт просто неба</h3>
                <p>28 травня, 19:00</p>
            </article>

            <article>
                <h3>Виставка сучасного мистецтва</h3>
                <p>30 травня, 12:00</p>
            </article>
        </section>
    </main>

    <aside id="selected-event">
        <h2>Деталі обраної події</h2>
        <p>Натисніть на подію, щоб побачити деталі.</p>
    </aside>

    <footer>
        <p>Контакти організаторів: info@city-events.ua</p>
    </footer>

    <script src="js/app.js" defer></script>
</body>

</html>
